[package]
name = "structured-stemmers"
version = "1.2.1"
edition = "2015"
authors = ["Jakob Demler <jdemler@curry-software.com>", "CurrySoftware <info@curry-software.com>"]
description = "Pure Rust Snowball stemming, including Ukrainian, maintained by structured-world"
repository = "https://github.com/structured-world/rust-stemmers"
documentation = "https://docs.rs/structured-stemmers"
readme = "README.md"
keywords = ["nlp", "stemming", "information", "retrieval", "language"]
license = "MIT AND BSD-3-Clause"
rust-version = "1.92"
include = ["/src/**", "/examples/**", "/algorithms/**", "/snowball.lock.json", "/Cargo.toml", "/README.md", "/LICENSE", "/LICENSE-SNOWBALL", "/NOTICE"]

[dependencies]
serde = "^1.0"
serde_derive = "^1.0"
