name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bootstrap:
        description: First publication of the new crate name using the temporary secret
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  release:
    needs: verify
    if: github.repository == 'structured-world/rust-stemmers' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        id: app
        with:
          app-id: ${{ secrets.RELEASER_APP_ID }}
          private-key: ${{ secrets.RELEASER_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2
        with:
          tool: cargo-semver-checks@0.50.0
      - run: cargo install release-plz --version 0.3.168 --locked
      - name: Bootstrap through release-plz
        if: github.event_name == 'workflow_dispatch' && inputs.bootstrap
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_BOOTSTRAP_TOKEN }}
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          test -n "$CARGO_REGISTRY_TOKEN"
          printf '[workspace]\nrelease_always = true\nsemver_check = true\ngit_tag_name = "v{{ version }}"\n' > "$RUNNER_TEMP/bootstrap.toml"
          release-plz release --config "$RUNNER_TEMP/bootstrap.toml"
          python3 scripts/trusted-publisher.py
      - name: Publish merged release PR using OIDC
        if: github.event_name != 'workflow_dispatch' || !inputs.bootstrap
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
        run: release-plz release --config .release-plz.toml
      - name: Clean build outputs
        if: always()
        run: cargo clean

  release-pr:
    needs: release
    if: github.repository == 'structured-world/rust-stemmers' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Only PR preparation can coalesce queued runs. A merged release must
    # always reach the publication job, even during a burst of main pushes.
    concurrency:
      group: registry-release-pr
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2
        with:
          tool: cargo-semver-checks@0.50.0
      - run: cargo install release-plz --version 0.3.168 --locked
      - uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        id: app
        with:
          app-id: ${{ secrets.RELEASER_APP_ID }}
          private-key: ${{ secrets.RELEASER_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Prepare release PR
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
        run: release-plz release-pr --config .release-plz.toml
      - name: Clean build outputs
        if: always()
        run: cargo clean
